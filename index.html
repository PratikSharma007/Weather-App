<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Parent-container">
        <h1>Weather App</h1>
        <form>
            <input type="text" placeholder="Enter City" id="city-input">
            <input type="submit" value="Get Weather" id="submit-input">
        </form>
        <div id="weather-data">
        </div>
        <div class="error">
            <h3>City not found. Please enter a valid city name.</h3>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
